name: Build Debug APK

# Runs automatically on every push to main, and can also be triggered manually
# from the "Actions" tab on GitHub ("Run workflow" button).
on:
  push:
    branches: [ "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This installs a real Gradle binary and makes the `gradle` command
      # available, so the build works even though this repo has no
      # gradlew/gradle-wrapper.jar committed yet. It also caches dependencies
      # between runs so future builds are faster.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # (Optional but recommended) generates gradlew/gradlew.bat/gradle-wrapper.jar
      # inside this run so the build is reproducible. Doesn't get committed back
      # to the repo automatically -- see README if you want to commit it once.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
